global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/prometheus_alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: flink
    static_configs:
      - targets: ['jobmanager:9249', 'taskmanager:9249']
  - job_name: application
    static_configs:
      - targets: ['application-metrics:8000']
  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
  - job_name: postgresql
    static_configs:
      - targets: ['postgres-exporter:9187']
