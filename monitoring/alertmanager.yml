global:
  resolve_timeout: 5m

route:
  receiver: local-ui
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

# Alerts are visible in the local Alertmanager UI. Add email, Slack, PagerDuty,
# or a webhook configuration to this receiver for external notifications.
receivers:
  - name: local-ui
