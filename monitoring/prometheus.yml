global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus_alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # The PyFlink MiniCluster runs on the host. A port range allows its
  # co-located JobManager and TaskManager reporters to bind independently.
  - job_name: 'flink'
    static_configs:
      - targets:
          - 'host.docker.internal:9249'
          - 'host.docker.internal:9250'

  - job_name: 'application'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Optional JourneyPulse overlay; up=0 when the module is not running.
  - job_name: 'journeypulse-targeting'
    static_configs:
      - targets: ['journeypulse-customers:8021']

  - job_name: 'journeypulse-segments'
    static_configs:
      - targets: ['journeypulse-segments:8022']
