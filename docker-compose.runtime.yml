# Opt-in: docker compose -f docker-compose.yml -f docker-compose.runtime.yml up -d --build
x-flink: &flink
  image: grab-pyflink:2.2.1
  build:
    context: .
    dockerfile: docker/Dockerfile.flink
  volumes:
    - flink_state:/opt/flink/state
  environment: &flink-env
    KAFKA_BOOTSTRAP: kafka:9092
    SOURCE_TOPIC: ${SOURCE_TOPIC:-user-events}
    DLQ_TOPIC: ${DLQ_TOPIC:-user-events-dlq}
    CONSUMER_GROUP: ${CONSUMER_GROUP:-flink-grab-consumer}
    POSTGRES_URL: jdbc:postgresql://postgres:5432/grabevents
    POSTGRES_HOST: postgres
    POSTGRES_DB: grabevents
    POSTGRES_USER: grabuser
    POSTGRES_PASS: grabpass
    FLINK_CHECKPOINT_DIR: file:///opt/flink/state/checkpoints
    FLINK_SAVEPOINT_DIR: file:///opt/flink/state/savepoints
    FLINK_CHECKPOINT_INTERVAL: ${FLINK_CHECKPOINT_INTERVAL:-30 s}
    FLINK_RESTORE_PATH: ${FLINK_RESTORE_PATH:-}
    FLINK_PARALLELISM: ${FLINK_PARALLELISM:-1}
    APPLICATION_METRICS_ENABLED: '0'
    FLINK_METRICS_PORTS: '9249'
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      rest.address: jobmanager
      rest.bind-address: 0.0.0.0
      taskmanager.numberOfTaskSlots: 2
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: 2048m
      heartbeat.interval: 1000 ms
      heartbeat.timeout: 10000 ms
      metrics.reporters: prom
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249

x-operations: &operations
  image: grab-operations:local
  build:
    context: .
    dockerfile: docker/Dockerfile.operations
  environment: &operations-env
    KAFKA_BOOTSTRAP: kafka:9092
    SOURCE_TOPIC: ${SOURCE_TOPIC:-user-events}
    DLQ_TOPIC: ${DLQ_TOPIC:-user-events-dlq}
    POSTGRES_HOST: postgres
    POSTGRES_DB: grabevents
    POSTGRES_USER: grabuser
    POSTGRES_PASS: grabpass

services:
  kafka:
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'kafka:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 20
  postgres:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grabuser -d grabevents']
      interval: 5s
      timeout: 5s
      retries: 20
  jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - '8081:8081'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8081/overview']
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager: {condition: service_healthy}
  pipeline:
    <<: *flink
    # Foreground submission waits for the result; no automatic resubmission
    # that could accidentally start a second job against the same sinks.
    command: ['flink', 'run', '--target', 'remote', '--jobmanager', 'jobmanager:8081', '--python', '/opt/app/flink-processor/pipeline.py']
    depends_on:
      jobmanager: {condition: service_healthy}
      taskmanager: {condition: service_started}
  producer:
    <<: *operations
    profiles: ['traffic']
    environment:
      <<: *operations-env
      PRODUCER_PROFILE: ${PRODUCER_PROFILE:-normal}
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-2}
      DUPLICATE_EVENT_RATE: ${DUPLICATE_EVENT_RATE:-0}
      DELAYED_EVENT_RATE: ${DELAYED_EVENT_RATE:-0}
      EVENT_RANDOM_SEED: ${EVENT_RANDOM_SEED:-42}
    depends_on:
      kafka: {condition: service_healthy}
  application-metrics:
    <<: *operations
    command: ['python', 'scripts/metrics_server.py']
    environment:
      <<: *operations-env
      DATALENS_EVIDENCE_ENABLED: ${DATALENS_EVIDENCE_ENABLED:-0}
    ports:
      - '8000:8000'
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
  probe:
    <<: *operations
    profiles: ['tools']
    command: ['python', 'scripts/recovery_probe.py', '--help']
    volumes:
      - ./.flink-state:/opt/app/.flink-state
  prometheus:
    volumes:
      - ./monitoring/prometheus.runtime.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  flink_state:
