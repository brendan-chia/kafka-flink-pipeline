connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakehouse-catalog:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
iceberg.rest-catalog.vended-credentials-enabled=false
fs.s3.enabled=true
s3.endpoint=http://lakehouse-minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakehouse
s3.aws-secret-key=lakehouse-local-password
iceberg.expire-snapshots.min-retention=7d
iceberg.remove-orphan-files.min-retention=7d
